# Tool configuration only. The project is not packaged from this file.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]


[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["app"]

# passlib and python-jose publish no type information. Both are replaced in R1
# (ADR 0004: pwdlib with Argon2id, and stored tokens instead of JWT), so stubs
# are not worth adding for them.
[[tool.mypy.overrides]]
module = ["passlib.*", "jose.*"]
ignore_missing_imports = true