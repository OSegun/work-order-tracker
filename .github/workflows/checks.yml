name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: workorders
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workorders
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql+psycopg://workorders:postgres@localhost:5432/workorders
      TEST_DATABASE_URL: postgresql+psycopg://workorders:postgres@localhost:5432/workorders
      SECRET_KEY: placeholder

    steps:
      - name: work-order-tracker
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Create the environment
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: Lint with Ruff
        run: .venv/bin/ruff check .

      - name: Check formatting with Ruff
        run: .venv/bin/ruff format --check .

      - name: Type-check with mypy
        run: .venv/bin/mypy

      - name: Apply the migrations
        run: .venv/bin/python -m alembic upgrade head

      - name: Check the models match the migrations
        run: .venv/bin/python -m alembic check

      - name: Run the tests with coverage
        run: .venv/bin/python -m pytest -q --cov=app --cov-report=term --cov-fail-under=80
